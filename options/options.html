<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wiki AI settings</title>
  <style>
    :root { color-scheme: light dark; --accent: #3366cc; --muted: #666; --border: #ccd; }
    @media (prefers-color-scheme: dark) { :root { --accent: #88a3e8; --muted: #9a9ea6; --border: #444; } }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-top: 36px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    .hint { color: var(--muted); font-weight: normal; font-size: 12.5px; }
    input[type=text], input[type=password], input[type=number] { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: normal; }
    .actions { margin-top: 24px; display: flex; gap: 8px; align-items: center; }
    button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    #status { color: var(--muted); }
    #status.err { color: #c4372c; }
  </style>
</head>
<body>
  <h1>Wiki AI settings</h1>

  <label>Base URL <span class="hint">OpenAI-compatible, ending in /v1</span>
    <input type="text" id="baseUrl" spellcheck="false">
  </label>
  <label>API key <span class="hint">stored only in this browser</span>
    <input type="password" id="apiKey" spellcheck="false" autocomplete="off">
  </label>
  <label>Model
    <input type="text" id="model" list="models" spellcheck="false">
  </label>
  <label>Fallback model <span class="hint">used when the main model answers 503 (e.g. the PC is off)</span>
    <input type="text" id="fallbackModel" list="models" spellcheck="false">
  </label>
  <datalist id="models"></datalist>
  <label>Prompt budget in tokens <span class="hint">0 = automatic per model (PC 48k, Mac 9B 12k, Saluki 10k)</span>
    <input type="number" id="contextTokens" min="0" step="1000">
  </label>
  <label>Max answer tokens
    <input type="number" id="maxAnswerTokens" min="200" step="100">
  </label>
  <label>Max research steps <span class="hint">tool-calling rounds before the model must answer</span>
    <input type="number" id="maxSteps" min="1" max="12">
  </label>
  <label class="check"><input type="checkbox" id="disableThinking"> Turn off thinking (faster answers)</label>

  <div class="actions">
    <button class="primary" id="save">Save</button>
    <button id="test">Test connection</button>
    <span id="status"></span>
  </div>

  <h2>Storage</h2>
  <p class="hint" id="storage">Checking…</p>
  <div class="actions">
    <button id="clearCache">Clear article cache</button>
    <span class="hint">Cached article text expires after a day and is capped at 300 articles. Saved topics are kept until you delete them in the sidebar.</span>
  </div>

  <script src="../lib/settings.js"></script>
  <script src="../lib/cache.js"></script>
  <script src="../lib/llm.js"></script>
  <script src="../lib/topics.js"></script>
  <script src="options.js"></script>
</body>
</html>
